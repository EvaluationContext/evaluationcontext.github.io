[project]
site_name = "Evaluation Context"
site_url = "https://evaluationcontext.com/"
site_author = "Jake Duddy"
site_description = "A blog about the Microsoft BI stack (Microsoft Fabric, Power BI, SQL, SSAS, DAX)"
repo_url = "https://github.com/EvaluationContext/evaluationcontext.github.io"
repo_name = "EvaluationContext"
copyright = """
Copyright &copy; 2024 - 2026 Jake Duddy -
<a href="/privacy/">Privacy Policy</a> -
<a href="#__consent">Change cookie settings</a>
"""

nav = [
  { Blog = ["index.md"] },
  { About = "about.md" },
  { Speaking = "speaking.md" },
  { Projects = "projects.md" },
]

extra_css = [
  "assets/css/extra.css",
  "assets/css/hero-image.css",
  "assets/css/codeblock.css",
  "assets/css/button.css",
  "assets/css/blogCards.css",
  "assets/css/posts.css",
  "assets/css/blogIndex.css",
  "assets/css/glightbox-custom.css",
  "assets/css/pill.css",
  "assets/css/colorBlocks.css",
  "assets/css/pages.css",
  "assets/css/timeline.css",
]

extra_javascript = [
  "https://cdn.jsdelivr.net/npm/vega@5",
  "https://cdn.jsdelivr.net/npm/vega-lite@5",
  "https://cdn.jsdelivr.net/npm/vega-embed@6",
  "assets/js/vegalite.js",
  "assets/js/lazy-images.js",
  "assets/js/interactions.js",
  "assets/js/timeline.js",
]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------

[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
favicon = "assets/images/favicon.ico"
logo = "assets/images/avatar.png"
features = [
  # "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.action.copy",  # "Copy as Markdown" button, fed by the llmstxt plugin
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tooltips",
  # "content.footnote.tooltips",
  # "content.tabs.link",
  # "header.autohide",
  # "navigation.expand",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  # "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  # "navigation.prune",
  "navigation.path",
  "toc.follow",
  # "toc.integrate",
]

# Loaded by Zensical from Google Fonts (replaces the @import in extra.css and
# stops the default Roboto download). Space Grotesk (headings) stays in extra.css.
[project.theme.font]
text = "IBM Plex Sans"
code = "JetBrains Mono"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
accent = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# ---------------------------------------------------------------------------
# Extra
# ---------------------------------------------------------------------------

[project.extra]
google_site_verification = "q73FZa2aE8cJGaBO5VjdcGjbOCyFq8twAw342e5nT4c"

[project.extra.analytics]
provider = "google"
property = "G-QLDJ0V4NT0"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/jakeduddy/"
name = "Jake Duddy"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/EvaluationContext"
name = "EvaluationContext"

[[project.extra.social]]
icon = "material/microsoft"
link = "https://community.fabric.microsoft.com/t5/user/viewprofilepage/user-id/1231947"
name = "Fabric Community"

[[project.extra.social]]
icon = "material/rss"
link = "https://evaluationcontext.com/feed_rss_created.xml"
name = "RSS Feed"

[project.extra.consent]
title = "Cookie consent"
description = """
We use cookies to measure and analyze how visitors interact with our site. \
This helps us understand what content is most valuable and improve your experience. \
You can change your preferences at any time."""
actions = ["accept", "manage", "reject"]

[project.extra.annotate]
json = [".s2"]

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------

[project.plugins.search]

[project.plugins.glightbox]

# Page tags: rendered on each page and used as filter chips in search
[project.plugins.tags]

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

# Writes llms.txt, llms-full.txt and a Markdown copy of every page next to its HTML
[project.plugins.llmstxt]
markdown_description = "Posts on Microsoft Fabric, Power BI and DAX by Jake Duddy"
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
Posts = [{ "posts/*" = "Blog post" }]
Pages = [
  { "about.md" = "About the author" },
  { "speaking.md" = "Talks, slides and recordings" },
  { "projects.md" = "Open-source projects" },
]

[project.plugins.blog]
post_url_format = "{slug}"
blog_dir = "."
# All posts on one index page so tag filtering (assets/js/interactions.js) is exact
pagination_per_page = 1000

[project.plugins.rss]
match_path = "posts/.*"
categories = ["categories"]
image = "https://evaluationcontext.com/assets/images/avatar.png"
json_feed_enabled = true
rss_feed_enabled = true
pretty_print = false
feed_ttl = 1440
length = 100
comments_path = "#__comments"

[project.plugins.rss.date_from_meta]
as_creation = "date.created"
as_update = "date.updated"
datetime_format = "%Y-%m-%d"
default_time = "00:00"
default_timezone = "UTC"

[project.plugins.rss.url_parameters]
utm_source = "rss-feed"
utm_medium = "RSS"
utm_campaign = "blog-syndication"

# Old category URLs (before categories were consolidated on 11 Oct 2026)
[project.plugins.redirects.redirect_maps]
"presentations/index.md" = "https://evaluationcontext.com/speaking/"
"category/pbip/index.md" = "https://evaluationcontext.com/category/cicd/"
"category/dax-lib/index.md" = "https://evaluationcontext.com/category/dax/"
"category/svg/index.md" = "https://evaluationcontext.com/category/visuals/"
"category/deneb/index.md" = "https://evaluationcontext.com/category/visuals/"
"category/vega/index.md" = "https://evaluationcontext.com/category/visuals/"
"category/data-modelling/index.md" = "https://evaluationcontext.com/category/modelling/"
"category/ssas-tabular/index.md" = "https://evaluationcontext.com/category/modelling/"
"category/real-time-intelligence/index.md" = "https://evaluationcontext.com/category/fabric/"
"category/lakehouse/index.md" = "https://evaluationcontext.com/category/fabric/"
"category/logging/index.md" = "https://evaluationcontext.com/category/fabric/"
"category/fabric-app/index.md" = "https://evaluationcontext.com/category/fabric/"
"category/translytical-task-flow/index.md" = "https://evaluationcontext.com/category/fabric/"
"category/ai/index.md" = "https://evaluationcontext.com/category/fabric/"
"category/graphs/index.md" = "https://evaluationcontext.com/category/administration/"
"category/vs-code/index.md" = "https://evaluationcontext.com/category/administration/"
"category/syntax-highlighting/index.md" = "https://evaluationcontext.com/category/blogging/"

# ---------------------------------------------------------------------------
# Markdown extensions
# ---------------------------------------------------------------------------

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem.smart_enable = "all"
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.options.custom_icons = ["overrides/.icons"]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink.normalize_issue_symbols = true
pymdownx.magiclink.repo_url_shorthand = true
pymdownx.magiclink.user = "squidfunk"
pymdownx.magiclink.repo = "mkdocs-material"
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
  # Rendered client-side by assets/js/vegalite.js (replaces mkdocs-charts-plugin)
  { name = "vegalite", class = "vegalite", format = "pymdownx.superfences.fence_div_format" },
  # Post timeline (daily users rail, category filter, sortable post cards), rendered by assets/js/timeline.js
  { name = "timeline", class = "ec-timeline", format = "pymdownx.superfences.fence_div_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tabbed.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
